version: "3"
dotenv:
  - .env
tasks:
  build:
    desc: Runs the build, supports '--watch' flag
    cmds:
      - npm run build
      # Copy output to $PLUGIN_DIR, forcibly overwriting existing files
      - |
        if [ -n "$PLUGIN_DIR" ]; then
          echo "Copying files to $PLUGIN_DIR (overwriting existing files)"
          mkdir -p "$PLUGIN_DIR"
          cp -f main.js manifest.json "$PLUGIN_DIR/"
          if [ -f styles.css ]; then
            cp -f styles.css "$PLUGIN_DIR/"
          fi
          if [ -d assets ]; then
            mkdir -p "$PLUGIN_DIR/assets"
            cp -rf assets/* "$PLUGIN_DIR/assets/"
          fi
          echo "Files copied successfully!"
        else
          echo "PLUGIN_DIR not set. Skipping copy."
        fi
    sources:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.css"
      - "!node_modules/**/*"
      - "!dist/**/*"
    generates:
      - "main.js"
      - "styles.css"

  sync:
    desc: Pull vault, plugin and theme, rebuild, and install both into the vault (VAULT_DIR, THEME_REPO, VAULT_REPO optional)
    cmds:
      - |
        set -euo pipefail
        VAULT_REPO="${VAULT_REPO:-../testing-vault}"
        THEME_REPO="${THEME_REPO:-../obsidian-ribbons-theme}"
        VAULT_DIR="${VAULT_DIR:-$VAULT_REPO}"
        THEME_NAME=$(node -p "require('$THEME_REPO/manifest.json').name")
        PLUGIN_ID=$(node -p "require('./manifest.json').id")
        for repo in "$VAULT_REPO" "$THEME_REPO" .; do
          git -C "$repo" pull --ff-only
        done
        npm ci
        PLUGIN_DIR="$VAULT_DIR/.obsidian/plugins/$PLUGIN_ID" task build
        mkdir -p "$VAULT_DIR/.obsidian/themes/$THEME_NAME"
        cp -f "$THEME_REPO/manifest.json" "$THEME_REPO/theme.css" "$VAULT_DIR/.obsidian/themes/$THEME_NAME/"
        echo "Synced into $VAULT_DIR. In Obsidian run 'Reload app without saving'."

  pr:
    desc: Prepare for PR - format code, lint, and type check
    cmds:
      - npm run format
      - npm run lint
      - npm run typecheck
      - npm run test

  release:
    desc: Release a new minor version of the plugin
    cmds:
      - npm run format:check
      - npm run typecheck
      - npm run lint
      - npm run test
      - ./release.sh
